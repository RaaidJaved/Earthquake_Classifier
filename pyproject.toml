[project]
name = "earthquake-classifier-pipeline"
version = "1.0.0"
description = "Automated Earthquake Classifier ETL & Dynamic EDA Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "pandas>=2.2.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.3",
]

[tool.vercel]
entrypoint = "main:app"
